[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmops-ai"
version = "0.3.0"
description = "Deterministic warehouse fleet simulation and dispatch experiments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]
web = ["fastapi==0.162.0", "uvicorn==0.54.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
