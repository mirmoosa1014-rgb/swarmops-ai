name: SwarmOps checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: python -m pip install -r requirements-web.txt
      - name: Build and typecheck production frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Verify core, models, API, persistence and cancellation
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Exercise the bundled learned model
        run: ./run.sh --policy learned --output runs/ci-demo
